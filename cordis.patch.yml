# Purely additive policy, composite-tool, and telemetry plugin.
# Never disables or replaces @deepseek-ai/dsh-agent-loop.
- insert:
    - id: agent-optimizer
      name: dsh-awesome-optimizer
      config:
        enabled: true
        runtimePolicy:
          mode: enforce
          noProgressLimit: 2
          recoveryAttemptLimit: 1
          minLargeWriteBytes: 8192
          maxShellCommandBytes: 4096
          maxInlineScriptBytes: 512
        fileMutationPolicy:
          mode: observe
          minLargeWriteBytes: 8192
        recoverFailedWrites: true
        editRecovery:
          enabled: true
          contextLines: 6
          maxSnippetLines: 20
        readGuard:
          enabled: true
          maxLineChars: 1500
          injectTailOutline: true
          maxOutlineEntries: 20
        compositeTools:
          enabled: true
          findAndRead: true
          editBatch: true
          maxPatterns: 5
          defaultContextLines: 5
          maxFiles: 5
          maxWindows: 10
          maxBatchEdits: 10
        convergence:
          enabled: true
          injectGuidance: true
          stepInterval: 8
          maxRemindersPerTurn: 4
        customPrompt:
          enabled: true
          globalFile: "~/.dsh/SYSTEM.md"
          workspaceFile: ".dsh/SYSTEM.md"
          # Placement modes:
          # - "replace-all": Strip ALL verbose official sections and use ONLY the refined SYSTEM.md
          # - "suffix": Append to end of official system prompt (Order 10300)
          placement: "replace-all"
          mergeStrategy: "concat"
          hotReload: true
        telemetry:
          enabled: true
          trackStreams: true
